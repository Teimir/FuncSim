[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "e32c-sim"
version = "0.1.0"
description = "Functional E32C ISA simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "hypothesis>=6.100",
  "ruff>=0.9",
]

[tool.coverage.run]
source = ["core"]
omit = ["*/cli/*"]

[tool.coverage.report]
fail_under = 83
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

# Example launchers mutate sys.path before importing from src; import blocks stay unsorted on purpose.
[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402", "I001"]

[project.scripts]
e32c-asm = "cli.asm:main"
e32c-ld = "cli.ld:main"
e32c-objcopy = "cli.objcopy:main"
e32c-cc = "cli.cc:main"
e32c-debug-gui = "cli.debug_gui.app:main"
e32c-gdb-server = "cli.gdb_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "test/tn9k/python"]
markers = [
  "slow: property-based and long integration tests (run with verify_all --full)",
  "tn9k: Tang Nano 9K isolated suite under test/tn9k/",
  "hw: requires programmed board and --port (see test/tn9k/hw/)",
  "toolchain: requires E32C_TOOLCHAIN (LLVM) in PATH",
  "toolchain_build: requires built LLVM backend",
  "toolchain_e2e: end-to-end sim/GDB/hex tests",
]
