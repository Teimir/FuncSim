# E32C opcode table for decoder (bits [31:26])
# field bit ranges are inclusive hi:lo, MSB = 31

word_width_bits: 32
pc_register: 31
zero_register: 0
# ABI: stack pointer is GPR 30 (see GPR_STACK_POINTER in core/state.py).
stack_pointer_register: 30

special_words:
  nop: 0x00000000
  halt: 0xFFFFFFFF

instructions:
  - mnemonic: NOP
    opcode: 0b000000
    format: special_nop
    fields: []

  - mnemonic: LDR
    opcode: 0b000001
    format: load_store
    fields:
      - name: raddr
        bits: [25, 21]
      - name: rdest
        bits: [20, 16]
      - name: mask
        bits: [15, 11]
      - name: imm11
        bits: [10, 0]

  - mnemonic: STR
    opcode: 0b000010
    format: store
    fields:
      - name: raddr
        bits: [25, 21]
      - name: rdata
        bits: [20, 16]
      - name: mask
        bits: [15, 11]
      - name: imm11
        bits: [10, 0]

  - mnemonic: ROL
    opcode: 0b000011
    format: rrr
    fields:
      - name: r1
        bits: [25, 21]
      - name: r2
        bits: [20, 16]
      - name: res
        bits: [15, 11]

  - mnemonic: SMUL
    opcode: 0b000100
    format: rrr
    fields:
      - name: r1
        bits: [25, 21]
      - name: r2
        bits: [20, 16]
      - name: res
        bits: [15, 11]

  - mnemonic: JMP
    opcode: 0b010000
    format: branch
    fields:
      - name: raddr
        bits: [25, 21]
      - name: imm11
        bits: [10, 0]

  - mnemonic: JZ
    opcode: 0b010001
    format: branch
    fields:
      - name: raddr
        bits: [25, 21]
      - name: imm11
        bits: [10, 0]

  - mnemonic: JNZ
    opcode: 0b010010
    format: branch
    fields:
      - name: raddr
        bits: [25, 21]
      - name: imm11
        bits: [10, 0]

  - mnemonic: JC
    opcode: 0b010011
    format: branch
    fields:
      - name: raddr
        bits: [25, 21]
      - name: imm11
        bits: [10, 0]

  - mnemonic: JS
    opcode: 0b010100
    format: branch
    fields:
      - name: raddr
        bits: [25, 21]
      - name: imm11
        bits: [10, 0]

  - mnemonic: JO
